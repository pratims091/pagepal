name: Deploy to DigitalOcean Droplet

on:
  workflow_run:
    workflows: ["lint"]
    types:
      - completed
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: prod
    env:
      DIGITALOCEAN_ACCESS_TOKEN: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}
      DROPLET_IP: ${{ secrets.DROPLET_IP }}
      DROPLET_USER: ${{ secrets.DROPLET_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      APP_PATH: ${{ secrets.APP_PATH }}
      LANGSMITH_TRACING: ${{ secrets.LANGSMITH_TRACING }}
      LANGSMITH_ENDPOINT: ${{ secrets.LANGSMITH_ENDPOINT }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_PROJECT: ${{ secrets.LANGSMITH_PROJECT }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
      CRAWL4AI_API_TOKEN: ${{ secrets.CRAWL4AI_API_TOKEN }}
      STREAMING_ENABLED: ${{ secrets.STREAMING_ENABLED }}
      CRAWL4AI_HOST: ${{ secrets.CRAWL4AI_HOST }}
      CRAWL_TIMEOUT: ${{ secrets.CRAWL_TIMEOUT }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
      VECTOR_STORE_DIR: ${{ secrets.VECTOR_STORE_DIR }}
      LLM_MODEL: ${{ secrets.LLM_MODEL }}
      EMBEDDING_MODEL: ${{ secrets.EMBEDDING_MODEL }}
      CACHE_EXPIRY_DAYS: ${{ secrets.CACHE_EXPIRY_DAYS }}
      STREAM_CHUNK_SIZE: ${{ secrets.STREAM_CHUNK_SIZE }}
      LOG_LEVEL: ${{ secrets.LOG_LEVEL }}
      LOG_FORMAT: ${{ secrets.LOG_FORMAT }}
      LOG_FILE: ${{ secrets.LOG_FILE }}
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PAT: ${{ secrets.DOCKERHUB_PAT }}

    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_PAT }}

      - name: Create .env file
        run: |
          echo "LANGSMITH_TRACING=${{ env.LANGSMITH_TRACING }}" > .env
          echo "LANGSMITH_ENDPOINT=${{ env.LANGSMITH_ENDPOINT }}" >> .env
          echo "LANGSMITH_API_KEY=${{ env.LANGSMITH_API_KEY }}" >> .env
          echo "LANGSMITH_PROJECT=${{ env.LANGSMITH_PROJECT }}" >> .env
          echo "TELEGRAM_BOT_TOKEN=${{ env.TELEGRAM_BOT_TOKEN }}" >> .env
          echo "GOOGLE_API_KEY=${{ env.GOOGLE_API_KEY }}" >> .env
          echo "CRAWL4AI_API_TOKEN=${{ env.CRAWL4AI_API_TOKEN }}" >> .env
          echo "STREAMING_ENABLED=${{ env.STREAMING_ENABLED }}" >> .env
          echo "CRAWL4AI_HOST=${{ env.CRAWL4AI_HOST }}" >> .env
          echo "CRAWL_TIMEOUT=${{ env.CRAWL_TIMEOUT }}" >> .env
          echo "SUPABASE_URL=${{ env.SUPABASE_URL }}" >> .env
          echo "SUPABASE_KEY=${{ env.SUPABASE_KEY }}" >> .env
          echo "VECTOR_STORE_DIR=${{ env.VECTOR_STORE_DIR }}" >> .env
          echo "LLM_MODEL=${{ env.LLM_MODEL }}" >> .env
          echo "EMBEDDING_MODEL=${{ env.EMBEDDING_MODEL }}" >> .env
          echo "CACHE_EXPIRY_DAYS=${{ env.CACHE_EXPIRY_DAYS }}" >> .env
          echo "STREAM_CHUNK_SIZE=${{ env.STREAM_CHUNK_SIZE }}" >> .env
          echo "LOG_LEVEL=${{ env.LOG_LEVEL }}" >> .env
          echo "LOG_FORMAT=${{ env.LOG_FORMAT }}" >> .env
          echo "LOG_FILE=${{ env.LOG_FILE }}" >> .env
          echo "DOCKERHUB_USERNAME=${{ env.DOCKERHUB_USERNAME }}" >> .env

      - name: Set environment variables
        run: |
          echo "IMAGE_TAG=${GITHUB_SHA::8}" >> $GITHUB_ENV

      - name: Build and push Docker images
        run: |
          # Build and push using docker-compose
          docker compose build pagepal
          docker compose push pagepal

          docker tag ${{ env.DOCKERHUB_USERNAME }}/pagepal:${IMAGE_TAG} ${{ env.DOCKERHUB_USERNAME }}/pagepal:latest
          docker push ${{ env.DOCKERHUB_USERNAME }}/pagepal:latest

      - name: Copy .env file to Droplet
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.DROPLET_IP }}
          username: ${{ env.DROPLET_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: ".env"
          target: "${{ env.APP_PATH }}"

      - name: Copy docker-compose.yaml to Droplet
        uses: appleboy/scp-action@v0.1.3
        with:
          host: ${{ env.DROPLET_IP }}
          username: ${{ env.DROPLET_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          source: docker-compose.yaml
          target: "${{ env.APP_PATH }}"

      - name: Deploy to Droplet via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.DROPLET_IP }}
          username: ${{ env.DROPLET_USER }}
          key: ${{ env.SSH_PRIVATE_KEY }}
          script: |
            cd "${{ env.APP_PATH }}"
            docker login -u ${{ env.DOCKERHUB_USERNAME }} -p ${{ env.DOCKERHUB_PAT }}
            docker compose pull
            docker compose up -d --remove-orphans