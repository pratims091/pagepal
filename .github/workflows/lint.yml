name: lint

on:
  pull_request:
    branches: [ dev, master ]
    types: [ opened, synchronize, reopened ]
  push:
    branches: ['*']

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pipenv
        pipenv install --dev

    - name: Lint
      run: |
        pipenv run lint
